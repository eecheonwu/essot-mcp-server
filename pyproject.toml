[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "essot-mcp-server"
version = "0.1.1"
description = "ESSOT MCP Server for connecting AI IDEs with the Engineering SSOT Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Emmanuel Echeonwu", email = "eecheonwu@aimsammi.org" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "essot",
    "ai-agents",
    "developer-tools",
    "ssot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "fastmcp>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
essot-mcp-server = "essot_mcp_server.server:main"

[project.urls]
Homepage = "https://essot.space"
Repository = "https://pypi.org/project/essot-mcp-server/"
Issues = "https://github.com/eecheonwu/essot-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["essot_mcp_server"]
