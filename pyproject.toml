[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "essot-mcp-server"
version = "0.1.0"
description = "ESSOT MCP Server for integration with the ESSOT Web App"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "requests",
    "pydantic",
    "fastapi",
    "uvicorn",
    "openai>=3.3.0",
]

[project.scripts]
essot-mcp-server = "essot_mcp_server.server:mcp.run"
